[project]
name = "edge-ops"
version = "0.1.0"
description = "PPE cloud platform: the cloud service behind one web app"
requires-python = ">=3.12"
dependencies = ["shared", "trace_id", "cloud"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/shared", "package/edge_link", "package/trace_id", "services/edge", "services/cloud"]

[tool.uv.sources]
shared = { workspace = true }
edge_link = { workspace = true }
trace_id = { workspace = true }
edge = { workspace = true }
cloud = { workspace = true }

# Each service keeps its own pytest.ini (pythonpath, asyncio mode); run them from the service directory.

[tool.ruff]
line-length = 120
extend-exclude = ["legacy"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/File() are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "shared", "trace_id", "cloud"]
