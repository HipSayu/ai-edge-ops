[project]
name = "edge-ops"
version = "0.1.0"
description = "Cloud-Edge AI platform: Cloud control plane, Edge Agent, AI Runtime"
requires-python = ">=3.12"
dependencies = [
    "hopquangdo-messaging[mqtt]",
    "hopquangdo-http",
    "hopquangdo-observability",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "psutil>=6.0",
    "numpy>=1.26",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "docker-py>=1.10.6",
    "huggingface-hub>=2.0.0",
]

[project.optional-dependencies]
runtime = ["ultralytics"]
ml = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "scikit-learn>=1.5", "torch>=2.3", "jupyter>=1.0"]
assistant = ["langchain>=1.0", "langgraph>=1.0", "langchain-anthropic>=1.0", "langgraph-checkpoint-redis>=0.5", "openai>=1.50", "qdrant-client>=1.12"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.20"]

[tool.uv.workspace]
members = ["packages/messaging", "packages/http", "packages/observability"]

[tool.uv.sources]
hopquangdo-messaging = { workspace = true }
hopquangdo-http = { workspace = true }
hopquangdo-observability = { workspace = true }
ultralytics = { path = "packages/ultralytics", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages/messaging/src",
    "packages/http/src",
    "packages/observability/src",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["src", "apps"]
