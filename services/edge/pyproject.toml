[project]
name = "edge"
version = "0.1.0"
description = "Edge runtime: reads camera frames next to the cameras, runs the PPE detector and publishes violation events over MQTT."
requires-python = ">=3.12"
dependencies = [
    "edge_link",
    "pydantic-settings>=2.4",
    "paho-mqtt>=2.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge"]
