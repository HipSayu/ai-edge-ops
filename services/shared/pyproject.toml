[project]
name = "shared"
version = "0.1.0"
description = "Code shared by the cloud, assistant and gateway services: roles, viewer, errors, token verification."
requires-python = ">=3.12"
dependencies = ["pyjwt[crypto]>=2.8", "fastapi>=0.115", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
