[project]
name = "cloud"
version = "0.1.0"
description = "Cloud service: identity, sites/nodes/cameras, PPE violations, vision."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "edge_link",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.8",
    "cryptography>=43",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "python-multipart>=0.0.9",
    "paho-mqtt>=2.1",
    "redis>=5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud"]
