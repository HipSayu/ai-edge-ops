name: CI Edge

# Edge node image: edge-agent (amd64 + arm64). The AI runtime image is built from the parent repo's runtime/.
# PRs only build; pushes to main also publish to GHCR, where edge nodes pull them from.
on:
  pull_request:
    paths:
      - "apps/edge/**"
      - "src/edge/**"
      - "src/shared/**"
      - "packages/**"
      - "requirements-edge.txt"
      - "infra/docker/edge/**"
      - "infra/compose/edge/**"
      - ".github/workflows/ci-edge.yml"
  push:
    branches: [main]
    paths:
      - "apps/edge/**"
      - "src/edge/**"
      - "src/shared/**"
      - "packages/**"
      - "requirements-edge.txt"
      - "infra/docker/edge/**"
      - "infra/compose/edge/**"
      - ".github/workflows/ci-edge.yml"
  workflow_dispatch:

concurrency:
  group: ci-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: edge-agent
            file: infra/docker/edge/Dockerfile.api
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edgeops" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.registry }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
