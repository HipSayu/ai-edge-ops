name: Deploy Web

# Web dashboard (apps/web; nginx proxies to the cloud) → EC2. Env secret: CLOUD_ENV (the compose .env).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "!apps/web/dist/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/_build-deploy.yml"
  workflow_dispatch:

jobs:
  web:
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      services: web
      images: '[{"name":"web","context":"apps/web","file":"apps/web/Dockerfile"}]'
      env_secret: CLOUD_ENV
