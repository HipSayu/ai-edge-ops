name: Deploy Web

# Web dashboard (apps/dashboard; nginx proxies to api/ws/assistant) → EC2, port 80.
on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "!apps/dashboard/example/**"
      - "infra/compose/cloud/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/_build-deploy.yml"
  workflow_dispatch:

jobs:
  web:
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      services: dashboard
      images: '[{"name":"web-dashboard","context":"apps/dashboard","file":"apps/dashboard/Dockerfile"}]'
