name: Deploy Cloud

# Cloud service (REST + MCP) → EC2, only when its code or what it installs changes. Env secret: CLOUD_ENV (the compose .env).
on:
  push:
    branches: [main]
    paths:
      - "services/cloud/**"
      - "services/shared/**"
      - "package/trace_id/**"
      - "package/edge_link/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-cloud.yml"
      - ".github/workflows/_build-deploy.yml"
  workflow_dispatch:

jobs:
  cloud:
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      services: cloud
      images: '[{"name":"cloud","context":".","file":"services/cloud/Dockerfile"}]'
      env_secret: CLOUD_ENV
