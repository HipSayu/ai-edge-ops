name: CI

# Lint + tests, only for what a change touches: each Python service, the edge runtime and the web dashboard.
# A change to shared/ or edge_link/ re-tests every service that installs them.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.py.outputs.changes }}
      web: ${{ steps.web.outputs.web }}
      integration: ${{ steps.web.outputs.integration }}
    steps:
      - uses: actions/checkout@v4

      - id: py
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cloud:
              - "services/cloud/**"
              - "services/shared/**"
              - "package/trace_id/**"
              - "package/edge_link/**"
              - ".github/workflows/ci.yml"
            edge:
              - "services/edge/**"
              - "package/edge_link/**"
              - ".github/workflows/ci.yml"

      - id: web
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - "apps/web/**"
              - ".github/workflows/ci.yml"
            integration:
              - "tests/**"
              - "services/cloud/**"
              - "services/shared/**"
              - "package/trace_id/**"
              - "package/edge_link/**"
              - ".github/workflows/ci.yml"

  python:
    # One job per changed service: it installs its own dependencies plus the shared package.
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    runs-on: ubuntu-latest
    services:
      redis:  # the Redis-backed adapters are tested against the real thing (redis-stack: RediSearch + JSON)
        image: redis/redis-stack-server:7.4.0-v8
        ports: ["6379:6379"]
    env:
      CLOUD_TEST_REDIS: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest pytest-asyncio httpx ruff
          if [ "${{ matrix.service }}" != "edge" ]; then pip install -e ../shared -e ../../package/trace_id; fi
      - name: Ruff
        continue-on-error: true
        run: ruff check src tests

      - name: Pytest
        run: python -m pytest -q

  # Needs a real MQTT broker (edge_link).
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements.txt

      - run: |
          python -m pip install -U pip
          pip install -r services/cloud/requirements.txt pytest pytest-asyncio httpx
          pip install -e services/shared -e package/trace_id

      - name: Start MQTT broker
        run: |
          printf 'listener 1883\nallow_anonymous true\n' > mosquitto.conf
          docker run -d --name mqtt -p 1883:1883 -v "$PWD/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2

      - name: Edge link against the broker
        env:
          EDGE_LINK_TEST_BROKER: 127.0.0.1:1883
        run: |
          pip install -e package/edge_link
          cd package/edge_link && python -m pytest -q

      - name: trace_id
        run: |
          pip install -e package/trace_id pytest starlette httpx
          cd package/trace_id && python -m pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # Single required check for branch protection: skipped jobs count as passed, failed ones do not.
  ci-ok:
    if: always()
    needs: [changes, python, integration, web]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
