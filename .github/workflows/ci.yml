name: CI

# Lint + tests for the Python monorepo (cloud/edge/assistant) and lint/build of the dashboard.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-cloud.txt -r requirements-edge.txt -r requirements-assistant.txt
          pip install ruff "pytest>=8" "pytest-asyncio>=0.24"

      # TODO: existing code has ~126 ruff findings; make blocking once `ruff check --fix` is applied.
      - name: Ruff
        continue-on-error: true
        run: ruff check apps/cloud apps/edge apps/assistant src tests

      - name: Pytest
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
