name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # python-packages is a private submodule -> needs a PAT (repo:read scope)
          token: ${{ secrets.SUBMODULE_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (editable)
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -e "packages/svc_core[fastapi,mqtt,dev]" \
                      -e "libs/edge_protocol[dev]" \
                      -e "server[dev]" \
                      -e "edge_agent[dev]"

      - name: Ruff
        working-directory: backend
        run: |
          ruff check packages/svc_core/src libs/edge_protocol/src server/app edge_agent/src \
                     server/tests edge_agent/tests packages/svc_core/tests

      - name: Pytest
        working-directory: backend
        run: |
          set -e
          for pkg in packages/svc_core libs/edge_protocol server edge_agent; do
            echo "::group::pytest $pkg"
            (cd "$pkg" && python -m pytest -q)
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint

      - name: Build
        working-directory: frontend
        run: npm run build
