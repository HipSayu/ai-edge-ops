name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # python-packages is a private submodule -> needs a PAT (repo:read scope)
          token: ${{ secrets.SUBMODULE_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (editable)
        run: |
          python -m pip install -U pip
          pip install -e "packages/svc_core[fastapi,mqtt,redis,sqlalchemy,security,dev]" \
                      -e "libs/edge_protocol[dev]" \
                      -e "server[dev]" \
                      -e "edge_agent[dev]" \
                      -e "inference[dev]"

      - name: Ruff
        run: |
          ruff check packages/svc_core/src libs/edge_protocol/src server/app \
                     edge_agent/src inference/src \
                     server/tests edge_agent/tests inference/tests packages/svc_core/tests

      - name: Import boundaries
        working-directory: server
        run: lint-imports

      - name: Pytest
        run: |
          set -e
          for pkg in packages/svc_core libs/edge_protocol server edge_agent inference; do
            echo "::group::pytest $pkg"
            (cd "$pkg" && python -m pytest -q)
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/packages-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npx oxlint

      - name: Build
        working-directory: ui
        run: npm run build
