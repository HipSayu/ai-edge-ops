name: Edge image

# Edge runtime image (amd64 + arm64), pulled by the edge nodes from GHCR. PRs only build; pushes to main publish.
on:
  pull_request:
    paths: &paths
      - "services/edge/**"
      - "package/edge_link/**"
      - ".github/workflows/deploy-edge.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: edge-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: reg
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edgeops" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.registry }}/edge
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/edge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
