name: Deploy Assistant

# Chatbot agent (apps/assistant) → EC2. Env secret: ASSISTANT_ENV.
on:
  push:
    branches: [main]
    paths:
      - "apps/assistant/**"
      - "src/assistant/**"
      - "packages/http/**"
      - "packages/observability/**"
      - "requirements-assistant.txt"
      - "infra/docker/assistant/**"
      - "infra/compose/cloud/**"
      - ".github/workflows/deploy-assistant.yml"
      - ".github/workflows/_build-deploy.yml"
  workflow_dispatch:

jobs:
  assistant:
    uses: ./.github/workflows/_build-deploy.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      services: assistant
      images: '[{"name":"assistant","context":".","file":"infra/docker/assistant/Dockerfile"}]'
      env_secret: ASSISTANT_ENV
      env_file: assistant.env
