# Production stack — runs on the deploy host. Images come from GHCR (pushed by CI).
#   cp .env.prod.example .env  &&  edit  &&  docker compose -f docker-compose.prod.yml pull && up -d
# Caddy terminates TLS: /api/* -> server, /*/whip|whep -> mediamtx, else -> frontend.
# CI ships this file + Caddyfile + mediamtx.prod.yml to /opt/ai-edge-ops (see .github/workflows/deploy.yml).
name: ai-edge-ops

services:
  caddy:
    container_name: ai-edge-ops-prod-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - frontend
      - mediamtx

  frontend:
    container_name: ai-edge-ops-prod-frontend
    image: ${IMAGE_PREFIX:-ghcr.io/hopquangdo/ai-edge-ops}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  server:
    container_name: ai-edge-ops-prod-server
    image: ${IMAGE_PREFIX:-ghcr.io/hopquangdo/ai-edge-ops}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: production
      EDGE_TRANSPORT: mqtt
      DB__URL: postgresql+asyncpg://ppe:${POSTGRES_PASSWORD}@db:5432/ai_edge_ops
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "30"
      MQTT__HOST: mqtt
      MQTT__PORT: "8883"
      MQTT__CLIENT_ID: ai-edge-ops-server
      MQTT__TLS: "true"
      MQTT__TLS_CA_FILE: /run/secrets/mqtt/ca.crt
      MQTT__TLS_CERT_FILE: /run/secrets/mqtt/server.crt
      MQTT__TLS_KEY_FILE: /run/secrets/mqtt/server.key
      MQTT__USERNAME: ${MQTT_USERNAME}
      MQTT__PASSWORD: ${MQTT_PASSWORD}
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3__SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3__BUCKET: artifacts
      REDIS__URL: redis://redis:6379/0
      MEDIAMTX_WHIP_URL: https://${DOMAIN}
      MEDIAMTX_WHEP_URL: https://${DOMAIN}
    volumes:
      - ./secrets/server-mqtt:/run/secrets/mqtt:ro
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
      mediamtx:
        condition: service_started

  mediamtx:
    container_name: ai-edge-ops-prod-mediamtx
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    ports:
      - "8189:8189/udp"  # WebRTC/ICE — HTTP signaling goes through Caddy
    volumes:
      - ./mediamtx.prod.yml:/mediamtx.yml:ro

  db:
    container_name: ai-edge-ops-prod-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_edge_ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe -d ai_edge_ops"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    container_name: ai-edge-ops-prod-mqtt
    image: emqx/emqx:5.8
    restart: unless-stopped
    ports:
      - "1883:1883"   # plain MQTT (LAN / VPN)
      - "8883:8883"   # MQTT over TLS (edge devices)
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_etc:/opt/emqx/etc

  minio:
    container_name: ai-edge-ops-prod-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  redis:
    container_name: ai-edge-ops-prod-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  miniodata:
  emqx_data:
  emqx_etc:
  redisdata:
  caddy_data:
  caddy_config:
