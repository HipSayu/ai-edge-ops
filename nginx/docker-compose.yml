# Infra bundle for the VPS: Postgres, Redis, EMQX (MQTT), MinIO, MediaMTX,
# with nginx fronting MediaMTX's WHIP/WHEP signaling on port 80.
#
# server + frontend + edge agent all run on your laptop and point here.
#
# Deploy (from this folder, on the VPS):
#   $EDITOR .env                 # set VPS_HOST; secrets are pre-filled
#   docker compose up -d
#
# Open in the VPS firewall: TCP 80 55432 56379 51883 58083 59000 59001, UDP 58189

# Project name (container/volume/network prefix) comes from COMPOSE_PROJECT_NAME
# in .env — default below is the fallback if that's unset.
name: ${COMPOSE_PROJECT_NAME:-edgeops}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [mediamtx]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${PG_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]

  mqtt:
    image: emqx/emqx:5.8
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    ports:
      - "${MQTT_PORT:-51883}:1883"
      - "${MQTT_DASHBOARD_PORT:-58083}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_etc:/opt/emqx/etc
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes: [miniodata:/data]

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${VPS_HOST}
      MTX_WEBRTCLOCALUDPADDRESS: ":${MEDIAMTX_ICE_PORT:-58189}"
      # streaming-token auth webhook -> your (local) FastAPI server. Default is
      # "internal" = open, for early dev. Set MTX_AUTH_METHOD=http and
      # BACKEND_AUTH_URL once the server is reachable from the VPS.
      MTX_AUTHMETHOD: ${MTX_AUTH_METHOD:-internal}
      MTX_AUTHHTTPADDRESS: ${BACKEND_AUTH_URL:-http://127.0.0.1/api/v1/streaming/auth}
    ports:
      - "${MEDIAMTX_HTTP_PORT:-58889}:8889"
      - "${MEDIAMTX_ICE_PORT:-58189}:${MEDIAMTX_ICE_PORT:-58189}/udp"
    volumes:
      - ./conf/mediamtx.yml:/mediamtx.yml:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  emqx_data:
  emqx_etc:
