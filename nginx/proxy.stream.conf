# MQTT + backing-service forwarding on the PUBLIC VPS (210.245.52.119), for
# clients that are NOT on the 192.168.100.x LAN (remote edge devices, a laptop
# elsewhere running the server). Skip anything your clients reach on the LAN.
#
# nginx `stream {}` is a separate top-level block. Wire it into the system nginx
# once — in /etc/nginx/nginx.conf, next to `http { ... }`:
#     stream { include /etc/nginx/stream.d/*.conf; }
#
# then:
#     sudo mkdir -p /etc/nginx/stream.d
#     sudo cp proxy.stream.conf /etc/nginx/stream.d/edgeops.conf
#     sudo nginx -t && sudo systemctl reload nginx
#     # firewall: open the ports you keep below

upstream edgeops_mqtt     { server 192.168.100.35:51883; }
upstream edgeops_pg       { server 192.168.100.35:55432; }
upstream edgeops_redis    { server 192.168.100.35:56379; }
upstream edgeops_minio    { server 192.168.100.35:59000; }
upstream edgeops_webrtc   { server 192.168.100.35:58189; }

# edge devices: MQTT__HOST=210.245.52.119  MQTT__PORT=51883  MQTT__TLS=false
server { listen 51883; proxy_pass edgeops_mqtt;  proxy_timeout 1h; }

# WebRTC media for browsers watching video through the VPS. Also set
# MTX_WEBRTCADDITIONALHOSTS=210.245.52.119 in the infra .env so MediaMTX
# advertises this host in its ICE candidates.
server { listen 58189 udp; proxy_pass edgeops_webrtc; proxy_timeout 1m; }

# only if a remote machine runs the server against this DB / cache / storage
server { listen 55432; proxy_pass edgeops_pg;    proxy_timeout 1h; }
server { listen 56379; proxy_pass edgeops_redis; proxy_timeout 5m; }
server { listen 59000; proxy_pass edgeops_minio; proxy_timeout 5m; }
