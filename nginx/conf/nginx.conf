# AI Edge Ops infra — everything for this stack lives under /edgeops so it can
# share the VPS IP with other apps. Plain HTTP, IP-based, no domain / no TLS.
# Mounted read-only at /etc/nginx/nginx.conf.
#
#   http://210.245.52.119/edgeops/            -> status
#   http://210.245.52.119/edgeops/<cam>/whip  -> mediamtx  (edge publish)
#   http://210.245.52.119/edgeops/<cam>/whep  -> mediamtx  (browser view)
#
# Postgres / Redis / MQTT / MinIO are published straight to the host on their
# own ports (see ../docker-compose.yml) — not proxied here.
#
# Later, when server + frontend move onto the VPS, add under `location /edgeops/`:
#   location /edgeops/api/ { proxy_pass http://server:8000/api/; ...ws headers... }
#   location /edgeops/     { proxy_pass http://frontend:80/;      }

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    proxy_max_temp_file_size 0;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80 default_server;
        server_name _;

        # WHIP/WHEP: strip the /edgeops prefix so MediaMTX sees "cam_<id>/whip".
        location ~ ^/edgeops/(cam_[^/]+/(?:whip|whep))$ {
            proxy_pass http://mediamtx:8889/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # this stack only owns /edgeops — leave the rest of the IP for other apps
        location / { return 404; }
    }
}
