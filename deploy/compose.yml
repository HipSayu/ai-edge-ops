# ─────────────────────────────────────────────────────────────────────────────
# DEV STACK — everything on one machine. Run from app/deploy/:
#
#   for f in infra app edge; do cp .env.$f.example .env.$f; done
#   export COMPOSE_ENV_FILES=.env.infra,.env.app,.env.edge
#   docker compose up --build                     # infra + server (live reload)
#   docker compose --profile edge up --build      # + edge-agent + inference
#
#   docker compose down             # keep volumes
#   docker compose down -v          # drop pgdata / redisdata / edge state
#
#   API + docs    http://localhost:8000/docs
#   EMQX dash     http://localhost:58083   admin / <EMQX_DASHBOARD_PASSWORD>
#   local agent   http://localhost:9100/status
#
# The frontend runs separately: `npm run dev` in app/ui.
# Infra comes from compose.infra.yml (included below). Every value is in the
# .env.* files — see the .example siblings. No literals, no fallbacks.
# ─────────────────────────────────────────────────────────────────────────────
name: ${COMPOSE_PROJECT_NAME}

include:
  - compose.infra.yml

services:
  server:
    container_name: ${COMPOSE_PROJECT_NAME}-server
    image: ${SERVER_IMAGE}
    build:
      context: ..                 # bundles svc_core + edge_protocol
      dockerfile: server/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: ${SERVER_ENVIRONMENT}
      EDGE_TRANSPORT: ${SERVER_EDGE_TRANSPORT}
      REALTIME_TRANSPORT: ${SERVER_REALTIME_TRANSPORT}
      CORS_ORIGINS: ${SERVER_CORS_ORIGINS}
      EVIDENCE_DIR: ${SERVER_EVIDENCE_DIR}
      DB__URL: ${SERVER_DB_URL}
      REDIS__URL: ${SERVER_REDIS_URL}
      MQTT__HOST: ${SERVER_MQTT_HOST}
      MQTT__PORT: ${SERVER_MQTT_PORT}
      MQTT__TLS: ${SERVER_MQTT_TLS}
      MEDIAMTX_WHIP_URL: ${SERVER_MEDIAMTX_WHIP_URL}
      MEDIAMTX_WHEP_URL: ${SERVER_MEDIAMTX_WHEP_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS}
    volumes:
      - ../server:/srv/server
      - evidencedata:${SERVER_EVIDENCE_DIR}
    ports: ["${SERVER_HTTP_PORT}:8000"]
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  # ── edge node (profile: edge) ────────────────────────────────────────────
  edge-agent:
    container_name: ${COMPOSE_PROJECT_NAME}-edge-agent-${DEVICE_ID}
    image: ${EDGE_AGENT_IMAGE}
    profiles: ["edge"]
    build:
      context: ..
      dockerfile: edge_agent/Dockerfile
    environment:
      DEVICE_ID: ${DEVICE_ID}
      TRANSPORT: ${AGENT_TRANSPORT}
      MQTT__HOST: ${AGENT_MQTT_HOST}
      MQTT__PORT: ${AGENT_MQTT_PORT}
      MQTT__TLS: ${AGENT_MQTT_TLS}
      MQTT__USERNAME: ${AGENT_MQTT_USERNAME}
      MQTT__PASSWORD: ${AGENT_MQTT_PASSWORD}
      SERVER__BASE_URL: ${AGENT_SERVER_BASE_URL}
      CAMERAS: ${AGENT_CAMERAS}
      INFERENCE_SOCKET: /run/edge/inference.sock
      COMPOSE__PROJECT_DIR: /project
      COMPOSE__ENV_FILE: /project/.env.edge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # real device: docker-socket-proxy
      - .:/project                                   # dir with a compose.yml + .env.edge
      - edge_state:/var/lib/edge-agent
      - ipc:/run/edge
    ports: ["${AGENT_API_PORT}:9100"]
    restart: unless-stopped

  inference:
    container_name: ${COMPOSE_PROJECT_NAME}-inference-${DEVICE_ID}
    image: ${INFERENCE_IMAGE}
    profiles: ["edge"]
    build:
      context: ..
      dockerfile: inference/Dockerfile
    environment:
      SOCKET_PATH: /run/edge/inference.sock
      RUNTIME: ${INFERENCE_RUNTIME}
    volumes:
      - ipc:/run/edge
    healthcheck:
      test: ["CMD", "test", "-S", "/run/edge/inference.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  evidencedata:
  edge_state:
  ipc:
