# ─────────────────────────────────────────────────────────────────────────────
# APP OVERLAY (prod) — Caddy + frontend + server from GHCR. Always layered on
# the infra base:
#
#   cd /opt/ai-edge-ops
#   cp .env.example .env  &&  $EDITOR .env       # prod values (see "prod:" notes)
#   docker compose -f compose.infra.yml -f compose.app.yml pull
#   docker compose -f compose.infra.yml -f compose.app.yml up -d
#
# Caddy terminates TLS:  /api/* -> server:8000 ; /*/whip|whep -> mediamtx:8889 ;
# else -> frontend:80. CI ships compose.infra.yml + compose.app.yml + config/
# to /opt/ai-edge-ops on every push to main. Runbook: ../DEPLOY.md
# ─────────────────────────────────────────────────────────────────────────────
name: ${COMPOSE_PROJECT_NAME}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      DOMAIN: ${DOMAIN}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server, frontend, mediamtx]

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
    restart: unless-stopped

  server:
    container_name: ${COMPOSE_PROJECT_NAME}-server
    image: ${IMAGE_PREFIX}-server:${IMAGE_TAG}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: ${SERVER_ENVIRONMENT}
      EDGE_TRANSPORT: ${SERVER_EDGE_TRANSPORT}
      REALTIME_TRANSPORT: ${SERVER_REALTIME_TRANSPORT}
      CORS_ORIGINS: ${SERVER_CORS_ORIGINS}
      EVIDENCE_DIR: ${SERVER_EVIDENCE_DIR}
      DB__URL: ${SERVER_DB_URL}
      REDIS__URL: ${SERVER_REDIS_URL}
      MQTT__HOST: ${SERVER_MQTT_HOST}
      MQTT__PORT: ${SERVER_MQTT_PORT}
      MQTT__TLS: ${SERVER_MQTT_TLS}
      MQTT__CLIENT_ID: ai-edge-ops-server
      MQTT__TLS_CA_FILE: /run/secrets/mqtt/ca.crt
      MQTT__TLS_CERT_FILE: /run/secrets/mqtt/server.crt
      MQTT__TLS_KEY_FILE: /run/secrets/mqtt/server.key
      MQTT__USERNAME: ${MQTT_USERNAME}
      MQTT__PASSWORD: ${MQTT_PASSWORD}
      MEDIAMTX_WHIP_URL: ${SERVER_MEDIAMTX_WHIP_URL}
      MEDIAMTX_WHEP_URL: ${SERVER_MEDIAMTX_WHEP_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS}
    volumes:
      - evidencedata:${SERVER_EVIDENCE_DIR}
      - ./secrets/server-mqtt:/run/secrets/mqtt:ro
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  evidencedata:
  caddy_data:
  caddy_config:
