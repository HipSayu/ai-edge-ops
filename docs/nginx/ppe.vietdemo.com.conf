# nginx on the machine that runs docker compose (the 563 server): /etc/nginx/sites-available/ppe.vietdemo.com,
# linked into sites-enabled, then `nginx -t && nginx -s reload`. Routes by host name, so the other sites of that nginx are
# not touched (never use `server_name _` here: another site already owns it).
#
# Published by compose on this machine: the web on WEB_PORT (58080) and the API on API_PORT (58200).
server {
    listen 80;
    server_name ppe.vietdemo.com;

    client_max_body_size 200M;  # video uploads

    # the API goes straight to the cloud; SSE (chat) and MJPEG (camera) must not be buffered
    location /api/ {
        proxy_pass http://127.0.0.1:58200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:58080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
