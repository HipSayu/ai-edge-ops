# For the PUBLIC VPS's system nginx (210.245.52.119) — NOT the docker bundle.
# Infra HTTP only: forwards MediaMTX WHIP/WHEP signaling to 192.168.100.35.
# (server / frontend proxying is handled elsewhere.)
#
#   sudo cp proxy.conf /etc/nginx/conf.d/edgeops.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # firewall: open TCP 58080
#
# Access:  http://210.245.52.119:58080/cam_*/whip|whep   -> mediamtx

server {
    listen 58080;
    server_name _;
    client_max_body_size 512M;
    proxy_max_temp_file_size 0;

    # camera paths are always "cam_<id>" (server/app/modules/streaming/service.py)
    location ~ ^/(cam_[^/]+/(?:whip|whep))$ {
        proxy_pass http://192.168.100.35:58889/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / { return 404; }
}
