[project]
name = "edge_link"
version = "0.1.0"
description = "The link between the cloud and the edge runtimes: MQTT topics, messages, and a publisher and a subscriber for them."
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_link"]
