# Cloud host (EC2): Postgres, Redis, MQTT broker, Cloud API, Assistant + Qdrant, and the dashboard on :80.
# The dashboard's nginx (:80) sends /api, /mcp and /health to the gateway, which routes to api / assistant.
#
#   cp .env.example .env; cp assistant.env.example assistant.env      # fill in (gitignored)
#   bash ../../scripts/gen-jwt-keys.sh keys                                   # RS256 key pair (gitignored)
#   docker compose up -d                                                      # everything
#   docker compose up -d --build api                                          # one service, built locally
#
# Images: $REGISTRY/<image>:$TAG (CI pins both); without them, the locally built edgeops/<image>:latest.
# .env is both the containers' env_file and what compose reads for ${...} below.
name: edgeops-cloud

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    # Postgres 16 + TimescaleDB (node_metrics / node_health_* hypertables, db/migrations/V004)
    image: timescale/timescaledb:2.17.2-pg16
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data
      # Run once on an empty volume
      - ../../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      retries: 20

  # Redis 8: bundles JSON + Query Engine, required by the assistant's LangGraph checkpointer
  redis:
    <<: *restart
    image: redis:8.2
    env_file: .env
    # Through docker-entrypoint.sh: it adds --loadmodule for the bundled JSON/Search modules
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      retries: 20

  # Edge agents connect from outside on :11883; containers here use mqtt:1883
  mqtt:
    <<: *restart
    image: eclipse-mosquitto:2
    ports: ["11883:1883"]
    volumes:
      - ../../config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt:/mosquitto/data

  # REST /api/v1, WebSocket /api/v1/ws, MCP /mcp and the embedded MQTT worker, one process.
  # Keep one instance: the embedded worker consumes MQTT.
  api:
    <<: *restart
    image: ${REGISTRY:-edgeops}/cloud-api:${TAG:-latest}
    build: { context: ../../.., dockerfile: infra/docker/cloud/Dockerfile.api }
    env_file: .env
    environment:
      CLOUD_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLOUD_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLOUD_MQTT_HOST: mqtt
      CLOUD_MQTT_PORT: "1883"
      CLOUD_EMBEDDED_WORKER: "true"
      CLOUD_JWT_PRIVATE_KEY_FILE: /run/keys/jwt_private.pem
    volumes:
      - ./keys/jwt_private.pem:/run/keys/jwt_private.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mqtt: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      start_period: 30s

  # API gateway (:8200): single entry point behind the dashboard nginx. Verifies access tokens with the Cloud's
  # public key only, then routes /api/v1/chat -> assistant (:8100), the rest -> api (:8000).
  gateway:
    <<: *restart
    image: ${REGISTRY:-edgeops}/gateway:${TAG:-latest}
    build: { context: ../../.., dockerfile: infra/docker/gateway/Dockerfile }
    environment:
      GATEWAY_JWT_PUBLIC_KEY_FILE: /run/keys/jwt_public.pem
      GATEWAY_LOG_JSON: "true"
    volumes:
      - ./keys/jwt_public.pem:/run/keys/jwt_public.pem:ro
    depends_on: [api, assistant]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant:/qdrant/storage

  # Chatbot agent. Uses the cloud Redis for chat streams and conversation memory; db 0 because
  # RediSearch (the LangGraph checkpointer index) only works on db 0.
  assistant:
    <<: *restart
    image: ${REGISTRY:-edgeops}/assistant:${TAG:-latest}
    build: { context: ../../.., dockerfile: infra/docker/assistant/Dockerfile }
    env_file: assistant.env
    environment:
      ASSISTANT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ASSISTANT_CLOUD_API_URL: http://api:8000
      ASSISTANT_QDRANT_URL: http://qdrant:6333
    depends_on: [api, qdrant]

  dashboard:
    <<: *restart
    image: ${REGISTRY:-edgeops}/web-dashboard:${TAG:-latest}
    build: { context: ../../../apps/dashboard }
    ports: ["80:80"]
    depends_on: [gateway]

volumes:
  postgres:
  redis:
  mqtt:
  qdrant:
