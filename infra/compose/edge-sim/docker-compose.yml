# One simulated edge node: the real agent without host networking, so several share one host
# (the cloud host, for demos). Started by infra/scripts/edge-sim.sh, one compose project per sim.
# Joins the cloud stack's network to reach mqtt:1883; all sims scrape one shared node-exporter.
services:
  agent:
    image: ${REGISTRY:-edgeops}/edge-agent:${TAG:-latest}
    restart: unless-stopped
    env_file: ${SIM_ENV:?set SIM_ENV}
    environment:
      EDGE_NODE_EXPORTER_URL: http://edgeops-sim-exporter:9100/metrics
      EDGE_STATE_DIR: ${SIM_STATE:?set SIM_STATE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on host and in the container: model files are bind-mounted into runtimes from here
      - ${SIM_STATE}:${SIM_STATE}
    networks: [cloud]

networks:
  cloud:
    name: edgeops-cloud_default
    external: true
