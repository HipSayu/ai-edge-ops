map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS — resolve the upstream per request so nginx starts even if the gateway is still down
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Every API call goes through the API gateway (apps/gateway, :8200): it verifies access tokens and routes
    # /api/v1/chat to the assistant (:8100), everything else to the Cloud (:8000). nginx only serves the SPA.
    set $gateway http://gateway:8200;

    location ~ ^/(api|mcp|health) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        # WebSocket upgrade (/api/v1/ws); empty for plain requests, which keeps upstream keep-alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE chat streams and MCP: pass bytes as they come
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
