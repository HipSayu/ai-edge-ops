server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html (routes use HashRouter, but keep this safe)
  location / {
    try_files $uri /index.html;
  }

  # API, MJPEG streams and chat SSE: no buffering, or the stream stalls
  location /api/ {
    proxy_pass http://cloud:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 1g;  # video uploads
  }
}
