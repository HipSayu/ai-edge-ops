# Backing services for the dev stack: Postgres, EMQX, MinIO, Redis, MediaMTX.
# Pulled into the app stack via `include:` in docker-compose.yml, or run on its
# own when you only want the infra:
#
#   docker compose -f docker-compose.data.yml up -d
#
# Host ports are deliberately in the 5xxxx range so this stack doesn't collide
# with a system Postgres/Redis or another project's 5432/6379/9000. Override any
# of them in app/.env (e.g. DB_PORT=5432) if you prefer the standard ports.
# Container-internal ports are unchanged, so nothing else in the stack cares.
#
#   Postgres        localhost:55432
#   Redis           localhost:56379
#   EMQX MQTT       localhost:51883      dashboard  localhost:58083  (admin/public)
#   MinIO API       localhost:59000      console    localhost:59001  (minioadmin/minioadmin)
#   MediaMTX HTTP   localhost:58889      WebRTC/ICE localhost:58189/udp

name: ai-edge-ops

services:
  db:
    container_name: ai-edge-ops-dev-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppe}
      POSTGRES_DB: ${POSTGRES_DB:-ai_edge_ops}
    ports: ["${DB_PORT:-55432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe -d ai_edge_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    container_name: ai-edge-ops-dev-mqtt
    image: emqx/emqx:5.8
    ports:
      - "${MQTT_PORT:-51883}:1883"
      - "${MQTT_DASHBOARD_PORT:-58083}:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    container_name: ai-edge-ops-dev-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes: ["miniodata:/data"]

  redis:
    container_name: ai-edge-ops-dev-redis
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-56379}:6379"]

  mediamtx:
    container_name: ai-edge-ops-dev-mediamtx
    image: bluenviron/mediamtx:1.9.3
    environment:
      # WebRTC/ICE: advertise the same port we publish on the host, so browser
      # ICE candidates are reachable. Set LAN_IP in app/.env for other machines.
      MTX_WEBRTCLOCALUDPADDRESS: ":${MEDIAMTX_ICE_PORT:-58189}"
      MTX_WEBRTCADDITIONALHOSTS: "${LAN_IP:-localhost}"
    ports:
      - "${MEDIAMTX_HTTP_PORT:-58889}:8889"                       # WHIP/WHEP HTTP signaling
      - "${MEDIAMTX_ICE_PORT:-58189}:${MEDIAMTX_ICE_PORT:-58189}/udp"  # WebRTC/ICE media
    volumes:
      - ./backend/server/mediamtx.yml:/mediamtx.yml:ro

volumes:
  pgdata:
  miniodata:
