[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edge-ops-server"
version = "0.1.0"
description = "AI Edge Ops control plane — devices, model registry, deployments, monitoring, alerts, analytics, edge gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "redis>=5.0",
    "dqh-svc-core[fastapi,mqtt]",
    "edge-protocol",
]

# local monorepo packages — installed editable (see Dockerfile / README)
[tool.uv.sources]
dqh-svc-core = { path = "../packages/svc_core", editable = true }
edge-protocol = { path = "../libs/edge_protocol", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-ignore = ["B008"]  # FastAPI uses Depends()/Body()/Query() in defaults by design

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
