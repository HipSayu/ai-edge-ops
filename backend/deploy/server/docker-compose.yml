# Central control-plane stack.  Run from backend/deploy/server/:
#   docker compose up --build
# API docs  http://localhost:8000/docs   |   EMQX  http://localhost:18083 (admin/public)
# MinIO     http://localhost:9001 (minioadmin/minioadmin)
name: ai-edge-ops-server

services:
  db:
    container_name: ai-edge-ops-dev-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ppe
      POSTGRES_PASSWORD: ppe
      POSTGRES_DB: ai_edge_ops
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe -d ai_edge_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    container_name: ai-edge-ops-dev-mqtt
    image: emqx/emqx:5.8
    ports: ["1883:1883", "18083:18083"]
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    container_name: ai-edge-ops-dev-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  redis:
    container_name: ai-edge-ops-dev-redis
    image: redis:7-alpine
    ports: ["6379:6379"]

  mediamtx:
    container_name: ai-edge-ops-dev-mediamtx
    image: bluenviron/mediamtx:1.9.3
    ports:
      - "8889:8889"   # WHIP/WHEP HTTP
      - "8189:8189/udp" # WebRTC/ICE
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  server:
    container_name: ai-edge-ops-dev-server
    image: ai-edge-ops/server:dev
    build:
      context: ../..
      dockerfile: server/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      EDGE_TRANSPORT: mqtt
      DB__URL: postgresql+asyncpg://ppe:ppe@db:5432/ai_edge_ops
      CORS_ORIGINS: '["http://localhost:5173"]'
      EVIDENCE_DIR: /var/lib/ai-edge-ops/evidence
      MQTT__HOST: mqtt
      MQTT__PORT: "1883"
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY_ID: minioadmin
      S3__SECRET_ACCESS_KEY: minioadmin
      S3__BUCKET: artifacts
      REDIS__URL: redis://redis:6379/0
      MEDIAMTX_WHIP_URL: http://localhost:8889
      MEDIAMTX_WHEP_URL: http://localhost:8889
    volumes:
      - ../../server:/srv/server
      - evidencedata:/var/lib/ai-edge-ops/evidence
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  evidencedata:
