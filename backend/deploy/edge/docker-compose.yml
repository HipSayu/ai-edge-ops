# Edge-node stack — runs ON each edge device (Jetson).  From backend/deploy/edge/:
#   MQTT_HOST=<central-broker> DEVICE_ID=cam-plant-a-01 docker compose up --build
# Local agent API: http://localhost:9100/status
name: ai-edge-ops-edge

services:
  edge-agent:
    container_name: ai-edge-ops-edge-agent-${DEVICE_ID:-edge-dev-0}
    image: ai-edge-ops/edge-agent:dev
    build:
      context: ../..
      dockerfile: edge_agent/Dockerfile
    environment:
      DEVICE_ID: ${DEVICE_ID:-edge-dev-0}
      TRANSPORT: mqtt
      LOG_LEVEL: INFO
      MQTT__HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT__PORT: ${MQTT_PORT:-8883}
      MQTT__CLIENT_ID: ${MQTT_CLIENT_ID:-edge-${DEVICE_ID:-edge-dev-0}}
      MQTT__USERNAME: ${MQTT_USERNAME:-}
      MQTT__PASSWORD: ${MQTT_PASSWORD:-}
      MQTT__TLS: ${MQTT_TLS:-true}
      MQTT__TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-/run/secrets/mqtt/ca.crt}
      MQTT__TLS_CERT_FILE: ${MQTT_TLS_CERT_FILE:-/run/secrets/mqtt/client.crt}
      MQTT__TLS_KEY_FILE: ${MQTT_TLS_KEY_FILE:-/run/secrets/mqtt/client.key}
      SERVER__BASE_URL: ${SERVER_BASE_URL:-http://host.docker.internal:8000/api/v1}
      # cameras: CAMERAS__0__ID / CAMERAS__0__SOURCE / CAMERAS__0__ZONE
      CAMERAS__0__ID: ${CAMERA_ID:-bay-1}
      CAMERAS__0__SOURCE: ${CAMERA_SOURCE:-0}
      CAMERAS__0__ZONE: ${CAMERA_ZONE:-loading-bay}
    ports:
      - "9100:9100"
    volumes:
      - edge_state:/var/lib/edge-agent
      - ${MQTT_CERT_DIR:-./certs}:/run/secrets/mqtt:ro
    # Jetson: uncomment for GPU + camera passthrough
    # runtime: nvidia
    # devices: ["/dev/video0:/dev/video0"]
    restart: unless-stopped

volumes:
  edge_state:
