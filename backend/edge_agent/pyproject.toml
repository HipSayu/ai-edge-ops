[project]
name = "ai-edge-ops-edge-agent"
version = "0.1.0"
description = "AI Edge Ops agent — runs on each edge device (Jetson): MQTT link, model runtime, camera pipeline, local API."
requires-python = ">=3.10"
dependencies = [
    "dqh-svc-core[fastapi,mqtt]",
    "edge-protocol",
    "psutil>=6",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
edge-agent = "edge_agent.main:main"

[project.optional-dependencies]
inference = ["ultralytics>=8.3", "opencv-python-headless>=4.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]

[tool.uv.sources]
dqh-svc-core = { path = "../packages/svc_core", editable = true }
edge-protocol = { path = "../libs/edge_protocol", editable = true }
ultralytics = { path = "package/ultralytics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-ignore = ["B008"]
