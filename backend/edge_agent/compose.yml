# Edge-node stack: the agent (host supervisor) + the inference container it swaps
# on every model deploy.
#
# Local end-to-end demo alongside the server (from the repo root):
#   docker compose --profile edge up --build edge-agent
#
# Real device: copy this file to the box, set DEVICE_ID / MQTT__HOST, and
#   docker compose up -d
# The agent then runs `docker compose pull inference && up -d --wait inference`
# itself on a T_DEPLOY_MODEL command (it rewrites INFERENCE_IMAGE in ./.env).
#
# The container-network values (MQTT__HOST: mqtt, SERVER__BASE_URL: http://server)
# are hardcoded on purpose — `docker compose include:` auto-loads this dir's .env
# as the *substitution* context, so `${MQTT__HOST:-mqtt}` would resolve to the
# bare-metal ".env" value instead of the fallback.
services:
  edge-agent:
    container_name: ai-edge-ops-edge-agent-${DEVICE_ID:-edge-dev-1}
    image: ai-edge-ops/edge-agent:dev
    profiles: ["edge"]
    build:
      context: ..                 # = backend/
      dockerfile: edge_agent/Dockerfile
    environment:
      DEVICE_ID: ${DEVICE_ID:-edge-dev-1}
      TRANSPORT: mqtt
      MQTT__HOST: mqtt
      MQTT__PORT: "1883"
      MQTT__TLS: "false"
      SERVER__BASE_URL: http://server:8000/api/v1
      INFERENCE_SOCKET: /run/edge/inference.sock
      COMPOSE__PROJECT_DIR: /project
      COMPOSE__ENV_FILE: /project/.env
      CAMERAS: '[{"id":"bay-1","source":"0","zone":"loading-bay","enabled":true,"fps_limit":10}]'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # real device: use docker-socket-proxy
      - .:/project                                   # so the agent can run `docker compose`
      - edge_state:/var/lib/edge-agent
      - ipc:/run/edge
    ports: ["9100:9100"]
    restart: unless-stopped
    # Real device: report HOST metrics, not the container's
    # pid: host
    # volumes: [ "/proc:/host/proc:ro", "/sys:/host/sys:ro" ]
    # environment: { HOST_PROC: /host/proc, HOST_SYS: /host/sys }

  inference:
    container_name: ai-edge-ops-inference-${DEVICE_ID:-edge-dev-1}
    # Swapped by the agent per model deploy; default = a runtime that emits
    # placeholder detections so the stack comes up before the first deploy.
    image: ${INFERENCE_IMAGE:-ai-edge-ops/inference:dev}
    profiles: ["edge"]
    build:
      context: ..
      dockerfile: inference/Dockerfile.cpu
    environment:
      SOCKET_PATH: /run/edge/inference.sock
      RUNTIME: ${INFERENCE_RUNTIME:-dummy}
    volumes:
      - ipc:/run/edge
    healthcheck:
      test: ["CMD", "test", "-S", "/run/edge/inference.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # GPU model image also needs:
    # runtime: nvidia
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

volumes:
  edge_state:
  ipc:
