# Edge-node service. Pulled into the root stack via `include:` under the `edge`
# profile — for a local end-to-end demo alongside the server:
#   docker compose --profile edge up --build edge-agent
#
# On a real device (Jetson) run this file standalone, pointing at a central broker:
#   cd backend/edge_agent && DEVICE_ID=1 MQTT__HOST=<broker> docker compose up -d
services:
  edge-agent:
    container_name: ai-edge-ops-edge-agent-${DEVICE_ID:-edge-dev-1}
    image: ai-edge-ops/edge-agent:dev
    profiles: ["edge"]
    build:
      context: ..                 # = backend/
      dockerfile: edge_agent/Dockerfile
    # NOTE: deliberately no `env_file: .env` here. `.env` next to this file is
    # for running the agent bare-metal on the host (where "localhost" is
    # correct — db/mqtt/server ports are published to the host).
    #
    # Also deliberately NOT using `${MQTT__HOST:-mqtt}`-style substitution for
    # the container-network values below: `docker compose include:` auto-loads
    # this directory's `.env` as the *substitution* context for this file
    # (independent of `env_file:`), so `${MQTT__HOST:-mqtt}` would silently
    # resolve to that .env's "localhost" instead of the "mqtt" fallback —
    # exactly the bug that caused this container to loop-crash. These are
    # hardcoded on purpose; they must always be the container hostnames.
    environment:
      DEVICE_ID: ${DEVICE_ID:-edge-dev-1}
      TRANSPORT: mqtt
      MQTT__HOST: mqtt
      MQTT__PORT: "1883"
      MQTT__TLS: "false"
      SERVER__BASE_URL: http://server:8000/api/v1
      INFERENCE__WEIGHTS_DIR: /var/lib/edge-agent/models
      CAMERAS: '[{"id":"bay-1","source":"0","zone":"loading-bay","enabled":true,"fps_limit":10,"loop":false}]'
    volumes:
      - edge_state:/var/lib/edge-agent
      - ./weights:/var/lib/edge-agent/models:ro
    ports: ["9100:9100"]
    restart: unless-stopped
    # Real device: report the HOST machine's metrics, not the container's
    # pid: host
    # volumes:
    #   - /proc:/host/proc:ro
    #   - /sys:/host/sys:ro
    # environment:
    #   HOST_PROC: /host/proc
    #   HOST_SYS: /host/sys
    # Jetson: uncomment for GPU + camera passthrough
    # runtime: nvidia
    # devices: ["/dev/video0:/dev/video0"]

volumes:
  edge_state:
