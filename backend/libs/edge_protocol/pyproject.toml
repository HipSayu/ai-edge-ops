[project]
name = "edge-protocol"
version = "0.1.0"
description = "AI Edge Ops server<->edge wire contract: Envelope payloads + MQTT topic scheme. Shared by server and edge_agent."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "dqh-svc-core",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
dqh-svc-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_protocol"]

[tool.hatch.metadata]
allow-direct-references = true
