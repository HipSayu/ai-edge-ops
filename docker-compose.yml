# Local dev stack. Run from app/:
#   docker compose -f docker-compose.data.yml up -d      # infra only
#   docker compose up --build                            # infra + server
#   docker compose --profile edge up --build             # + edge-agent (end-to-end demo)
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d   # + LAN reverse proxy
#
# API docs http://localhost:8000/docs
# EMQX     http://localhost:58083 (admin/public) | MinIO http://localhost:59001 (minioadmin/minioadmin)
#
# Backing services (Postgres/EMQX/MinIO/Redis/MediaMTX) + their host ports live
# in docker-compose.data.yml. Per-service config sits next to each package:
#   backend/server/compose.yml   backend/server/.env
#   backend/edge_agent/compose.yml   backend/edge_agent/.env
# Shared infra creds / port overrides: app/.env (see app/.env.example)

name: ai-edge-ops

include:
  - docker-compose.data.yml
  - backend/server/compose.yml
  - backend/edge_agent/compose.yml
