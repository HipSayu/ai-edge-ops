# Full local stack: Postgres + EMQX (MQTT) + MinIO + FastAPI backend + Vite frontend.
#   docker compose up --build
# Backend:   http://localhost:8000/docs
# Frontend:  http://localhost:5173
# EMQX UI:   http://localhost:18083  (admin / public)
# MinIO UI:  http://localhost:9001   (minioadmin / minioadmin)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ppe
      POSTGRES_PASSWORD: ppe
      POSTGRES_DB: ai_edge_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe -d ai_edge_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: local
      CORS_ORIGINS: '["http://localhost:5173"]'
      OFFLINE_THRESHOLD_SECONDS: "90"
      LATENCY_SLO_MS: "80"
      EDGE_TRANSPORT: mqtt
      DB__URL: postgresql+asyncpg://ppe:ppe@db:5432/ai_edge_ops
      MQTT__HOST: mqtt
      MQTT__PORT: "1883"
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY_ID: minioadmin
      S3__SECRET_ACCESS_KEY: minioadmin
      S3__BUCKET: artifacts
      REDIS__URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
